<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#07090d" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="apple-touch-icon" href="/icon.svg" />
  <title>Studio</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%23ffb020'/><text x='50' y='70' font-size='62' font-family='Arial' font-weight='900' text-anchor='middle' fill='%23160c02'>V</text></svg>" />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <div class="mark" id="stationMark">V</div>
      <div><b id="stName">Valhalla</b><small id="stSub">VALHALLA STUDIO</small></div>
    </div>
    <div class="tally" id="tally">Off air</div>
    <div class="clock"><span id="clock">--:--:--</span><small id="zone"></small></div>
    <div class="toh" title="Time to the top of the hour">TOH <b id="toh" class="num">--:--</b></div>
    <span class="spacer"></span>
    <canvas class="topmeter" id="topMeter" title="Program output"></canvas>
    <div class="pills">
      <span class="pill" id="pillAi"><i class="dot"></i><b>AI</b></span>
      <span class="pill" id="pillVoice"><i class="dot"></i><b>Voice</b></span>
      <span class="pill" id="pillBed"><i class="dot"></i>Bed</span>
      <span class="pill" id="pillStream"><i class="dot"></i><span class="num" id="listeners">0</span>&nbsp;listening</span>
    </div>
  </header>
  <div class="app">
    <nav class="side" id="nav">
      <a href="#studio" data-view="studio"><span>🎙️</span>Studio</a>
      <a href="#log" data-view="log"><span>📋</span>Log</a>
      <a href="#library" data-view="library"><span>🎵</span>Library</a>
      <a href="#clocks" data-view="clocks"><span>🕐</span>Clocks</a>
      <a href="#engineering" data-view="engineering"><span>🎚️</span>Engineering</a>
      <a href="#programming" data-view="programming"><span>🧑‍🎤</span>DJs</a>
      <a href="#imaging" data-view="imaging"><span>✨</span>Imaging</a>
      <a href="#commercials" data-view="commercials"><span>💵</span>Spots</a>
      <a href="#station" data-view="station"><span>🏷️</span>Station</a>
      <a href="#streaming" data-view="streaming"><span>📡</span>Stream</a>
      <a href="#ai" data-view="ai"><span>🤖</span>AI</a>
      <a href="#settings" data-view="settings"><span>⚙️</span>Settings</a>
    </nav>
    <main id="view"></main>
  </div>
  <nav class="tabbar" id="tabbar" aria-label="Main">
    <a href="#studio" data-view="studio"><span>🎙️</span>Studio</a>
    <a href="#log" data-view="log"><span>📋</span>Log</a>
    <a href="#library" data-view="library"><span>🎵</span>Library</a>
    <a href="#imaging" data-view="imaging"><span>✨</span>Imaging</a>
    <button type="button" id="moreBtn" aria-expanded="false"><span>☰</span>More</button>
  </nav>
  <div class="navscrim" id="navScrim"></div>
  <div class="toast" id="toast"></div>
  <div id="modalRoot"></div>
  <audio id="monitor" preload="none"></audio>
  <audio id="preview" preload="none"></audio>
  <script type="module" src="/app.js"></script>
</body>
</html>
